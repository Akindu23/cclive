<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>cclive</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23141416'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%2334d399' stroke-width='2.5' stroke-dasharray='40 17' stroke-linecap='round' transform='rotate(-90 16 16)'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%2334d399'/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#0b0b0c;--panel:#141416;--panel2:#1b1b1e;--border:#26262b;--text:#e7e7ea;--muted:#8b8b93;--dim:#5c5c66;--bad:#f87171;--font:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;--mono:"SF Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 var(--font)}
.wrap{max-width:1320px;margin:0 auto;padding:28px 24px 96px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px 18px}
.muted{color:var(--muted)}.dim{color:var(--dim)}.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1{font-size:17px;font-weight:650;margin:0;letter-spacing:-.015em;display:flex;align-items:center;gap:10px}
.mark{width:26px;height:26px;border-radius:7px;background:var(--panel2);border:1px solid var(--border);display:grid;place-items:center;flex:none}
.mark svg{width:16px;height:16px;display:block}
.mark .ring{stroke:var(--dim);transition:stroke .3s}.mark .core{fill:var(--dim);transition:fill .3s}
.mark.live .ring{stroke:#34d399;animation:orbit 4s linear infinite}.mark.live .core{fill:#34d399;animation:beat 1.6s ease-in-out infinite}
@keyframes orbit{to{stroke-dashoffset:-69}}
@keyframes beat{0%,100%{opacity:1}50%{opacity:.45}}
.tagline{font-size:12px;color:var(--muted);font-weight:400;margin-left:2px;padding-left:12px;border-left:1px solid var(--border)}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:transparent;color:var(--muted);padding:5px 11px;border-radius:999px;font:inherit;font-size:12px;cursor:pointer}
.chip:hover{color:var(--text)}.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip[disabled]{opacity:.35;cursor:default}.chip[disabled]:hover{color:var(--muted)}
#pager{padding:10px 10px 6px;font-size:12px;color:var(--muted)}#pager[hidden]{display:none}#pager .ctl .mono{color:var(--text)}
select{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font:inherit;font-size:12px;max-width:320px}
option.newest{color:#34d399}
select:focus,select:focus-visible,button:focus-visible{outline:none;border-color:var(--muted);box-shadow:0 0 0 2px rgba(255,255,255,.08)}
.ctl{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px}
.limit{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px 32px}
.limit>div:first-child{min-width:0}
#spent{font-size:17px}#spent .mono{font-weight:600}#spent #of{color:var(--muted)}
#reset{font-size:12.5px;margin-top:4px;white-space:nowrap}
#pct{font-size:13px;white-space:nowrap}#pct.over{color:var(--bad)}
.bar{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:#34d399;transition:width .3s}
@media (max-width:720px){.limit{grid-template-columns:1fr auto}.limit .bar{grid-column:1/-1}}
.bar.over i{background:var(--bad)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.tile .lbl{font-size:12px;color:var(--muted)}
.tile .val{font-size:22px;font-weight:600;margin-top:4px;letter-spacing:-.02em}
.tile .sub{font-size:11.5px;color:var(--dim);margin-top:2px}
.tile .warn{color:#fbbf24}
.tile .tok{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px;padding-top:8px;border-top:1px solid var(--border)}
.tile .tok .k{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
.tile .tok .v{font-size:12.5px;color:var(--muted);margin-top:2px}
#chartwrap{position:relative;height:220px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:-1px}
#table{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
/* Time, Source and Model size to their content, so Model sits right after the longest Source entry. The numeric columns share the slack: they are right-aligned, so extra width only spaces them out. */
th:not(.num),td:not(.num){width:1%}
th:nth-child(2){padding-left:30px} /* 10px cell padding + 14px chevron slot + 6px gap, so the header lines up with the labels */
th{font-weight:500;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);font-size:11.5px;white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid #1d1d21;white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.parent{cursor:pointer}tr.parent:hover td{background:#17171a}
tr.child td{background:#10101250}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.chev{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;line-height:1;color:var(--dim);font-size:10px;transition:transform .12s;flex:none}
.chev.open{transform:rotate(90deg)}
.src{display:inline-flex;align-items:center;gap:6px;vertical-align:middle}
.src .kind{color:var(--muted)}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;border:1px solid var(--border);color:var(--text)}
.pill i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:1px}
.badge{display:inline-block;padding:0 6px;border-radius:4px;font-size:10.5px;margin-left:6px;background:#2a2a30;color:var(--muted);vertical-align:middle}
.badge.aborted{background:#3b1f22;color:var(--bad)}
.badge.id{font-family:var(--mono);background:#1f2a3a;color:#93c5fd}
.badge.tool{font-family:var(--mono);background:#1c2420;color:#86efac}
.badge.attr{background:#2a2230;color:#d8b4fe}
tr.detail td{background:#10101250;color:var(--muted);font-size:12px;white-space:normal;padding:6px 10px 8px}
tr.detail .k{color:var(--dim);margin-right:6px}
tr.detail .mono{color:var(--text)}
tr.detail .item{display:block;line-height:1.8}
.pill .eff{color:var(--muted);margin-left:5px}
tr.agent td{background:#12121a}
.src .req{color:var(--dim)}
.empty{padding:32px;text-align:center;color:var(--dim)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dim);margin-right:9px;vertical-align:1px}
.dot.live{background:#34d399;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(52,211,153,.55)}50%{box-shadow:0 0 0 5px rgba(52,211,153,0)}}
#conn{font-size:11.5px;color:var(--muted);margin-left:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><h1><span id="dot" class="mark" aria-hidden="true"><svg viewBox="0 0 32 32"><circle class="ring" cx="16" cy="16" r="11" fill="none" stroke-width="3" stroke-dasharray="50 19" stroke-linecap="round" transform="rotate(-90 16 16)"/><circle class="core" cx="16" cy="16" r="5"/></svg></span>cclive<span class="tagline">Every Claude Code request, live as it lands in your transcripts</span><span id="conn" hidden>reconnecting…</span></h1><span id="summary" class="muted" style="font-size:12px"></span></div>
  <div id="budget" class="card" style="margin-top:0">
    <div class="limit">
      <div><div id="spent"><span id="mtd" class="mono"></span><span id="of"></span> spent</div><div id="reset" class="muted"></div></div>
      <div id="bar" class="bar" hidden><i></i></div>
      <div id="pct" class="muted" hidden></div>
    </div>
    <div class="dim" style="font-size:11.5px;margin-top:10px">Estimate at list price from local transcripts. Your invoice may differ. <span id="prices"></span></div>
    <div id="unlogged" class="dim" style="font-size:11.5px;margin-top:4px" hidden></div>
  </div>
  <div class="row" style="margin:18px 0 12px">
    <div id="chips" class="chips"></div>
    <div class="ctl"><select id="session" title="Session filter"><option value="">All sessions</option></select> Group by <select id="groupby"><option>model</option><option>source</option><option>session</option></select> Metric <select id="metric"><option>spend</option><option>tokens</option></select></div>
  </div>
  <div id="tiles" class="tiles"></div>
  <div class="card" style="margin-top:12px">
    <div id="charttitle" class="muted" style="font-size:12px;margin-bottom:8px"></div>
    <div id="chartwrap"><canvas id="chart"></canvas></div>
    <div id="legend" class="legend"></div>
  </div>
  <div class="card" style="margin-top:12px;padding:0 0 4px">
    <div class="row" style="padding:10px 10px 6px"><span class="muted" style="font-size:12px">Requests</span><button id="export" class="chip">Export CSV</button></div>
    <div id="table"></div>
    <div id="pager" class="row" hidden></div>
  </div>
</div>
<script src="/chart.js"></script>
<script>
const MODEL_COLORS = { fable: '#d97757', opus: '#60a5fa', sonnet: '#34d399', haiku: '#fde047' };
const PALETTE = ['#d97757', '#60a5fa', '#34d399', '#fde047', '#f472b6', '#fb923c', '#a3e635', '#38bdf8'];
const DAY = 86400e3;
const RANGES = { '1d': '1d', '7d': '7d', '30d': '30d', 'MTD': 'mtd', 'Last month': 'lastmonth' };
const PAGE_SIZES = [50, 100, 250];
const usd = v => v < 0.01 ? '$' + v.toFixed(4) : v < 1 ? '$' + v.toFixed(3) : '$' + v.toFixed(2);
const tok = n => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'k' : String(n);
const tm = ts => new Date(ts).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function modelInfo(id) {
  const parts = id.replace(/^claude-/, '').replace(/\[1m\]$/, '').replace(/-\d{8}$/, '').split('-');
  const name = parts[0];
  const short = name[0].toUpperCase() + name.slice(1) + (parts.length > 1 ? ' ' + parts.slice(1).join('.') : '');
  return { short, color: MODEL_COLORS[name] || '#8b8b93' };
}
function modelPill(id, effort = null) {
  const { short, color } = modelInfo(id);
  return `<span class="pill"><i style="background:${color}"></i>${esc(short)}${effort ? `<span class="eff" title="reasoning effort">· ${esc(effort)}</span>` : ''}</span>`;
}

function requestDetail(row) {
  const names = row.tools || [];
  const tools = names.filter(t => !t.startsWith('mcp__'));
  const mcp = names.filter(t => t.startsWith('mcp__')).map(t => t.replace(/^mcp__/, '').replace('__', ' › '));
  const skill = row.attribution?.startsWith('skill: ') ? row.attribution.slice(7) : null;
  const server = row.attribution?.startsWith('mcp: ') ? row.attribution.slice(5) : null;
  return { tools, mcp, skill, server, any: tools.length + mcp.length > 0 || !!skill };
}

/** Counts only; the MCP server chip carries its name because that is the only thing there is to show. */
function detailBadges(d) {
  return (d.tools.length ? `<span class="badge tool">Tools ${d.tools.length}</span>` : '')
    + (d.mcp.length ? `<span class="badge tool">MCP ${d.mcp.length}</span>` : '')
    + (d.skill ? `<span class="badge attr">Skill 1</span>` : '')
    + (d.server ? `<span class="badge attr">via ${esc(d.server)}</span>` : '');
}

function detailRowHTML(row, d, depth) {
  const counted = list => Object.entries(list.reduce((m, t) => (m[t] = (m[t] || 0) + 1, m), {}))
    .map(([t, n]) => `<span class="mono">${esc(t)}</span>${n > 1 ? ` ×${n}` : ''}`).join(', ');
  const items = [];
  if (d.tools.length) items.push(`<span class="item"><span class="k">Tools</span>${counted(d.tools)}</span>`);
  if (d.mcp.length) items.push(`<span class="item"><span class="k">MCP</span>${counted(d.mcp)}</span>`);
  if (d.skill) items.push(`<span class="item"><span class="k">Skill</span><span class="mono">${esc(d.skill)}</span></span>`);
  return `<tr class="child detail"><td></td><td colspan="7" style="padding-left:${depth * 18 + 30}px">${items.join('')}</td></tr>`;
}

const state = {
  rows: new Map(), sessions: [], top: [], childrenOf: new Map(), expanded: new Set(), budget: null, priceSource: '', unlogged: 0,
  range: '7d', session: new URLSearchParams(location.search).get('session') || null, groupBy: 'model', metric: 'spend',
  pageSize: 50, page: 0,
  visible: [],
};

/** [start, end); MTD and Last month sit on UTC month boundaries like the budget card. */
function rangeWindow(now = Date.now()) {
  const d = new Date(now);
  const monthStart = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1);
  switch (state.range) {
    case '1d': return [now - DAY, Infinity];
    case '7d': return [now - 7 * DAY, Infinity];
    case '30d': return [now - 30 * DAY, Infinity];
    case 'MTD': return [monthStart, Infinity];
    default: return [Date.UTC(d.getUTCFullYear(), d.getUTCMonth() - 1, 1), monthStart];
  }
}

function sessionLabel(id) {
  const s = state.sessions.find(s => s.sessionId === id);
  return s ? s.label : id;
}

function countSubs(row, agents = new Set()) {
  const reqs = (state.childrenOf.get(row.messageId) || []).reduce((n, c) => {
    agents.add(c.agentId);
    return n + 1 + countSubs(c, agents).reqs;
  }, 0);
  return { reqs, agents: agents.size };
}

function badgeTitle(row, flag) {
  if (flag !== 'compacted' || !row.compaction) return '';
  const c = row.compaction;
  return ` title="pre ${tok(c.preTokens)} · post ${tok(c.postTokens)} · dropped so far ${tok(c.cumulativeDroppedTokens)}"`;
}

/** Subagent rows collapse into one group per agent at the position of its newest request. */
function groupAgents(rows) {
  const nodes = [], byAgent = new Map();
  for (const r of rows) {
    if (r.sourceType !== 'subagent') { nodes.push(r); continue; }
    let g = byAgent.get(r.agentId);
    if (!g) {
      g = { group: true, agentId: r.agentId, sessionId: r.sessionId, sourceLabel: r.sourceLabel, timestamp: r.timestamp, rows: [] };
      byAgent.set(r.agentId, g);
      nodes.push(g);
    }
    g.rows.push(r);
  }
  return nodes;
}

const sumOf = (rows, f) => rows.reduce((s, r) => s + f(r), 0);
const shortId = id => id.slice(0, 7);
const chevHTML = (open, has) => `<span class="chev ${open ? 'open' : ''}">${has ? '▶' : ''}</span>`;
const srcHTML = (depth, chev, label) => {
  const [kind, desc] = label.includes(': ') ? label.split(/: (.*)/s) : [label, ''];
  return `<span class="src" style="padding-left:${depth * 18}px">${chev}${desc ? `<span class="kind">${esc(kind)}:</span> ${esc(desc)}` : esc(kind)}</span>`;
};
const numCells = (r, thinking, cache5m, cache1h) =>
  `<td class="num" title="not from cache · whole prompt ${tok(r.input + r.cacheRead + cache5m + cache1h)}">${tok(r.input)}</td>`
  + `<td class="num" title="thinking ${tok(thinking)}">${tok(r.output)}</td>`
  + `<td class="num">${tok(r.cacheRead)}</td>`
  + `<td class="num" title="5m ${tok(cache5m)} · 1h ${tok(cache1h)}">${tok(cache5m + cache1h)}</td>`
  + `<td class="num">${usd(r.estimate)}</td>`;

function groupHTML(g, depth) {
  const key = 'agent:' + g.agentId;
  const open = state.expanded.has(key);
  const total = { input: sumOf(g.rows, r => r.input), output: sumOf(g.rows, r => r.output), cacheRead: sumOf(g.rows, r => r.cacheRead), estimate: sumOf(g.rows, r => r.estimate) };
  const models = new Set(g.rows.map(r => r.model));
  const badges = `<span class="badge id" title="agent ${esc(g.agentId)}">${esc(shortId(g.agentId))}</span>`
    + `<span class="badge">${g.rows.length} Request${g.rows.length === 1 ? '' : 's'}</span>`;
  let html = `<tr class="parent agent ${depth ? 'child' : ''}" data-id="${esc(key)}" title="agent ${esc(g.agentId)}">`
    + `<td class="mono dim">${tm(g.timestamp)}</td><td>${srcHTML(depth, chevHTML(open, true), g.sourceLabel)}${badges}</td>`
    + `<td>${models.size === 1 ? modelPill(g.rows[0].model, new Set(g.rows.map(r => r.effort)).size === 1 ? g.rows[0].effort : null) : `<span class="dim">${models.size} models</span>`}</td>`
    + numCells(total, sumOf(g.rows, r => r.thinking), sumOf(g.rows, r => r.cacheWrite5m), sumOf(g.rows, r => r.cacheWrite1h)) + '</tr>';
  if (open) for (const r of g.rows) html += rowHTML(r, depth + 1, true);
  return html;
}

function rowHTML(row, depth, inGroup = false) {
  if (row.group) return groupHTML(row, depth);
  const children = groupAgents(state.childrenOf.get(row.messageId) || []);
  const open = state.expanded.has(row.messageId);
  const subs = countSubs(row);
  const detail = requestDetail(row);
  const expandable = children.length > 0 || detail.any;
  const chev = chevHTML(open, expandable);
  const src = inGroup
    ? `<span class="src" style="padding-left:${depth * 18}px">${chev}<span class="req">request</span></span>`
    : srcHTML(depth, chev, row.sourceLabel);
  const badges = row.flags.map(f => `<span class="badge ${f}"${badgeTitle(row, f)}>${f}</span>`).join('')
    + detailBadges(detail)
    + (subs.reqs ? `<span class="badge">${subs.agents} Sub-Agent${subs.agents === 1 ? '' : 's'} - ${subs.reqs} Request${subs.reqs === 1 ? '' : 's'}</span>` : '');
  const tip = `${row.messageId} · ${row.requestId}${row.agentId ? ' · agent ' + row.agentId : ''}`;
  let html = `<tr class="${expandable ? 'parent' : ''} ${depth ? 'child' : ''}" data-id="${esc(row.messageId)}" title="${esc(tip)}">`
    + `<td class="mono dim">${tm(row.timestamp)}</td><td>${src}${badges}</td><td>${modelPill(row.model, row.effort)}</td>`
    + numCells(row, row.thinking, row.cacheWrite5m, row.cacheWrite1h) + '</tr>';
  if (open && detail.any) html += detailRowHTML(row, detail, depth);
  if (open) for (const c of children) html += rowHTML(c, depth + 1);
  return html;
}

function renderChips() {
  document.getElementById('chips').innerHTML = Object.keys(RANGES)
    .map(k => `<button class="chip ${state.range === k ? 'on' : ''}" data-range="${k}">${k}</button>`).join('');
}

function renderSessions() {
  const sel = document.getElementById('session');
  sel.innerHTML = '<option value="">All sessions</option>' + state.sessions
    .map(s => `<option value="${esc(s.sessionId)}" class="${s.newest ? 'newest' : ''}">${s.newest ? '● ' : ''}${esc(s.label)}</option>`).join('');
  sel.value = state.session || '';
}

function renderTiles(rows) {
  const main = rows.filter(r => r.sourceType === 'main');
  const subs = rows.filter(r => r.sourceType === 'subagent');
  const unpriced = rows.filter(r => r.flags.includes('unpriced')).length;
  const n = k => `${k} request${k === 1 ? '' : 's'}`;
  const sum = (part, f) => part.reduce((s, r) => s + f(r), 0);
  const cell = (k, v, title) => `<div title="${title}"><div class="k">${k}</div><div class="v mono">${tok(v)}</div></div>`;
  const tile = (lbl, part, warn = '') =>
    `<div class="card tile"><div class="lbl">${lbl}</div><div class="val mono">${usd(sum(part, r => r.estimate))}</div>`
      + `<div class="sub">${n(part.length)}${warn}</div>`
      + `<div class="tok">`
      + cell('Input', sum(part, r => r.input), 'Input tokens not served from the prompt cache. Same as "input" in Claude Code\'s /usage.')
      + cell('Output', sum(part, r => r.output), 'Output tokens, thinking included.')
      + cell('Cache read', sum(part, r => r.cacheRead), 'Prompt tokens served from the cache, at a reduced price.')
      + cell('Cache write', sum(part, r => r.cacheWrite5m + r.cacheWrite1h), 'Prompt tokens written to the cache, at a premium price.')
      + `</div></div>`;
  document.getElementById('tiles').innerHTML =
    tile('Total estimate', rows, (unpriced ? ` · <span class="warn">${n(unpriced)} unpriced</span>` : '') + sessionCostNote())
    + tile('Main thread', main) + tile('Subagents', subs);
}

function sessionCostNote() {
  const s = state.session && state.sessions.find(s => s.sessionId === state.session);
  if (!s || s.costTotal === null) return '';
  const parts = Object.entries(s.costByModel).sort((a, b) => b[1] - a[1]).map(([m, c]) => `${esc(modelInfo(m).short)} ${usd(c)}`);
  if (!parts.length) parts.push(usd(s.costTotal));
  return `<br><span title="Per model, as Claude Code itself counted this session in its cost-state record. Covers the whole session, including requests the transcript never logged.">${parts.join(' · ')}</span>`;
}

const HOURLY = { hour: '2-digit', minute: '2-digit', hour12: false };
const DAILY = { month: 'short', day: 'numeric' };
function floorTo(ts, hourly) { const d = new Date(ts); hourly ? d.setMinutes(0, 0, 0) : d.setHours(0, 0, 0, 0); return d.getTime(); }
function nextBucket(ts, hourly) { const d = new Date(ts); hourly ? d.setHours(d.getHours() + 1) : d.setDate(d.getDate() + 1); return d.getTime(); }

const groupOf = {
  model: r => modelInfo(r.model).short,
  source: r => r.sourceType === 'main' ? 'main' : 'subagents',
  session: r => sessionLabel(r.sessionId),
};
const metricOf = {
  spend: r => r.estimate,
  tokens: r => r.input + r.cacheRead + r.cacheWrite5m + r.cacheWrite1h + r.output,
};
function colorFor(key, i, sample) {
  if (state.groupBy === 'model') return modelInfo(sample.model).color;
  if (state.groupBy === 'source') return key === 'main' ? '#d97757' : '#34d399';
  return PALETTE[i % PALETTE.length];
}

let chart = null;
/** Hour buckets when the window spans two days or less, else day buckets, in local time. */
function renderChart(rows) {
  const [a, b] = rangeWindow();
  const end = Math.min(b, Date.now());
  const hourly = end - a <= 2 * DAY;
  const keys = [];
  for (let k = floorTo(a, hourly); k <= floorTo(end - 1, hourly); k = nextBucket(k, hourly)) keys.push(k);
  const slot = new Map(keys.map((k, i) => [k, i]));
  const group = groupOf[state.groupBy], metric = metricOf[state.metric];
  const groups = new Map();
  for (const r of rows) {
    const key = group(r);
    if (!groups.has(key)) groups.set(key, { key, sample: r, data: new Array(keys.length).fill(0) });
    groups.get(key).data[slot.get(floorTo(r.timestamp, hourly))] += metric(r);
  }
  const series = [...groups.values()].map(g => {
    let c = 0;
    return { ...g, data: g.data.map(v => (c += v)), total: c };
  }).sort((x, y) => y.total - x.total);
  const fmt = state.metric === 'spend' ? usd : v => tok(Math.round(v));
  const datasets = series.map((s, i) => {
    const color = colorFor(s.key, i, s.sample);
    return { label: s.key, data: s.data, borderColor: color, backgroundColor: color + 'b3', borderWidth: 1, pointRadius: 0, fill: 'stack' };
  });
  const labels = keys.map(k => new Date(k).toLocaleString(undefined, hourly ? { ...DAILY, ...HOURLY } : DAILY));
  document.getElementById('charttitle').textContent = `Cumulative ${state.metric} by ${state.groupBy}`;
  document.getElementById('legend').innerHTML = series.map((s, i) =>
    `<span><i style="background:${colorFor(s.key, i, s.sample)}"></i>${esc(s.key)} <span class="dim">${fmt(s.total)}</span></span>`).join('')
    || '<span class="dim">No requests in range</span>';
  if (typeof Chart === 'undefined') return; // the bundle failed to load; the tiles and table still work
  if (!chart) {
    chart = new Chart(document.getElementById('chart'), {
      type: 'line',
      data: { labels, datasets },
      options: {
        animation: false, responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        scales: {
          x: { grid: { color: '#222226' }, ticks: { color: '#5c5c66', maxTicksLimit: 8, maxRotation: 0 } },
          y: { stacked: true, beginAtZero: true, grid: { color: '#222226' }, ticks: { color: '#5c5c66', callback: v => fmt(v) } },
        },
        plugins: { tooltip: { callbacks: { label: ctx => `${ctx.dataset.label}: ${fmt(ctx.parsed.y)}` } } },
      },
    });
  } else {
    chart.data.labels = labels;
    chart.data.datasets = datasets;
    chart.options.scales.y.ticks.callback = v => fmt(v);
    chart.options.plugins.tooltip.callbacks.label = ctx => `${ctx.dataset.label}: ${fmt(ctx.parsed.y)}`;
    chart.update('none');
  }
}

function isoLocal(ts) {
  const d = new Date(ts), p = n => String(Math.abs(n)).padStart(2, '0'), off = -d.getTimezoneOffset();
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`
    + `${off < 0 ? '-' : '+'}${p(Math.trunc(off / 60))}:${p(off % 60)}`;
}
const csvCell = v => /[",\r\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v);

function exportCsv() {
  const rows = [['Time', 'Source', 'Model', 'Effort', 'Tools', 'Attribution', 'Input', 'Output', 'Cache read', 'Cache write', 'Cost', 'Session', 'Flags']].concat(state.visible.map(r => [
    isoLocal(r.timestamp), r.sourceLabel, r.model, r.effort || '', (r.tools || []).join(' '), r.attribution || '', r.input, r.output, r.cacheRead, r.cacheWrite5m + r.cacheWrite1h,
    r.estimate.toFixed(6), sessionLabel(r.sessionId), r.flags.join(' '),
  ]));
  const blob = new Blob([rows.map(cells => cells.map(csvCell).join(',')).join('\r\n') + '\r\n'], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `cclive-${RANGES[state.range]}-${isoLocal(Date.now()).slice(0, 10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function pagerHTML(total, pages) {
  const from = total ? state.page * state.pageSize + 1 : 0, to = Math.min(total, (state.page + 1) * state.pageSize);
  const opts = PAGE_SIZES.map(n => `<option value="${n}" ${n === state.pageSize ? 'selected' : ''}>${n}</option>`).join('');
  return `<div class="ctl">Rows <select id="rows" title="Top-level rows per page">${opts}</select><span>Showing ${from}–${to} of ${total}</span></div>`
    + `<div class="ctl"><button class="chip" data-page="-1" ${state.page === 0 ? 'disabled' : ''}>Prev</button>`
    + `<span class="mono">${state.page + 1} / ${pages}</span>`
    + `<button class="chip" data-page="1" ${state.page >= pages - 1 ? 'disabled' : ''}>Next</button></div>`;
}

function render() {
  const groups = groupAgents(state.top);
  const pages = Math.max(1, Math.ceil(groups.length / state.pageSize));
  state.page = Math.min(state.page, pages - 1);
  const slice = groups.slice(state.page * state.pageSize, (state.page + 1) * state.pageSize);
  const body = slice.map(r => rowHTML(r, 0)).join('') || '<tr><td colspan="8" class="empty">No requests in range</td></tr>';
  const pager = document.getElementById('pager');
  pager.hidden = groups.length <= PAGE_SIZES[0];
  pager.innerHTML = pagerHTML(groups.length, pages);
  document.getElementById('table').innerHTML = '<table><thead><tr><th>Time</th><th>Source</th><th>Model</th>'
    + '<th class="num" title="Input tokens not served from the prompt cache. Same as &quot;input&quot; in Claude Code\'s /usage. Hover a cell for the whole prompt size.">Input</th>'
    + '<th class="num" title="Output tokens, thinking included.">Output</th>'
    + '<th class="num" title="Prompt tokens served from the cache, at a reduced price.">Cache read</th>'
    + '<th class="num" title="Prompt tokens written to the cache, at a premium price.">Cache write</th><th class="num">Cost</th></tr></thead>'
    + `<tbody>${body}</tbody></table>`;
}

/** yagni: full re-sort per frame over ~11k rows. */
function index() {
  const [a, b] = rangeWindow();
  const rows = [...state.rows.values()]
    .filter(r => r.timestamp >= a && r.timestamp < b && (!state.session || r.sessionId === state.session))
    .sort((x, y) => y.timestamp - x.timestamp);
  const ids = new Set(rows.map(r => r.messageId));
  state.visible = rows;
  state.top = [];
  state.childrenOf = new Map();
  for (const r of rows) {
    if (r.parentMessageId === null || !ids.has(r.parentMessageId)) { state.top.push(r); continue; } // orphan subagents stay at top level
    if (!state.childrenOf.has(r.parentMessageId)) state.childrenOf.set(r.parentMessageId, []);
    state.childrenOf.get(r.parentMessageId).push(r);
  }
  document.getElementById('summary').textContent = `${state.sessions.length} sessions · ${state.rows.size} requests`;
  renderChips();
  renderTiles(rows);
  renderChart(rows);
  renderBudget();
  render();
}

/** Coalesce into one redraw per animation frame. */
let frame = 0;
function schedule() {
  frame ||= requestAnimationFrame(() => { frame = 0; index(); });
}

/** Next 00:00 UTC on the 1st, shown in the viewer's zone so it matches the console reset line. */
function nextReset() {
  const now = new Date();
  const at = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth() + 1, 1));
  return at.toLocaleString('en-US', { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZoneName: 'short' });
}

/** Month to date over every held row, ignoring the chip and session filters. */
function renderBudget() {
  const budget = state.budget;
  const now = new Date();
  const monthStart = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), 1);
  let mtd = state.unlogged;
  for (const r of state.rows.values()) if (r.timestamp >= monthStart) mtd += r.estimate;
  document.getElementById('mtd').textContent = usd(mtd);
  const unlogged = document.getElementById('unlogged');
  unlogged.hidden = !(state.unlogged > 0);
  unlogged.textContent = `Includes ${usd(state.unlogged)} that Claude Code counted for finished sessions but never wrote as requests: aborted and retried streams, sidecar calls, compaction.`;
  document.getElementById('of').textContent = budget ? ` of ${usd(budget)}` : '';
  document.getElementById('reset').textContent = `${budget ? 'Monthly budget' : 'This month'} · Resets ${nextReset()}${budget ? '' : ' · Set a budget with --budget'}`;
  const bar = document.getElementById('bar');
  const pct = document.getElementById('pct');
  bar.hidden = pct.hidden = !budget;
  if (budget) {
    const share = mtd / budget;
    bar.firstElementChild.style.width = `${Math.min(100, share * 100)}%`;
    bar.classList.toggle('over', share >= 1);
    pct.classList.toggle('over', share >= 1);
    pct.textContent = `${Math.round(share * 100)}% used`;
  }
  document.getElementById('prices').textContent = state.priceSource;
}

function load(snapshot) {
  state.rows = new Map(snapshot.rows.map(r => [r.messageId, r]));
  state.sessions = snapshot.sessions;
  state.budget = snapshot.budget;
  state.priceSource = snapshot.priceSource;
  state.unlogged = snapshot.unlogged ?? 0;
  if (state.session && !state.sessions.some(s => s.sessionId === state.session)) setSession(null); // a bookmarked session that left the history window
  renderSessions();
  schedule();
}

function upsert(rows) {
  for (const r of rows) state.rows.set(r.messageId, r);
  schedule();
}

function setSession(id) {
  state.session = id;
  const url = new URL(location);
  id ? url.searchParams.set('session', id) : url.searchParams.delete('session');
  history.replaceState(null, '', url);
}

document.getElementById('table').addEventListener('click', e => {
  const tr = e.target.closest('tr.parent');
  if (!tr) return;
  const id = tr.dataset.id;
  state.expanded.has(id) ? state.expanded.delete(id) : state.expanded.add(id);
  render();
});
document.getElementById('chips').addEventListener('click', e => {
  const chip = e.target.closest('[data-range]');
  if (!chip) return;
  state.range = chip.dataset.range;
  state.page = 0;
  schedule();
});
document.getElementById('session').addEventListener('change', e => { setSession(e.target.value || null); state.page = 0; schedule(); });
document.getElementById('pager').addEventListener('click', e => {
  const b = e.target.closest('[data-page]');
  if (!b || b.disabled) return;
  state.page += Number(b.dataset.page);
  render();
  document.getElementById('table').scrollIntoView({ block: 'start' });
});
document.getElementById('pager').addEventListener('change', e => {
  if (e.target.id !== 'rows') return;
  state.pageSize = Number(e.target.value);
  state.page = 0;
  render();
});
document.getElementById('groupby').addEventListener('change', e => { state.groupBy = e.target.value; schedule(); });
document.getElementById('metric').addEventListener('change', e => { state.metric = e.target.value; schedule(); });
document.getElementById('export').addEventListener('click', exportCsv);

function setLive(on) {
  document.getElementById('dot').classList.toggle('live', on);
  document.getElementById('conn').hidden = on;
}

function connect() {
  const es = new EventSource('/api/events');
  es.addEventListener('hello', e => {
    setLive(true);
    document.getElementById('dot').title = 'boot ' + e.data;
    fetch('/api/snapshot').then(r => r.json()).then(load);
  });
  es.addEventListener('rows', e => upsert(JSON.parse(e.data)));
  es.addEventListener('snapshot', e => load(JSON.parse(e.data))); // the server re-priced every row
  es.addEventListener('unlogged', e => { state.unlogged = JSON.parse(e.data); schedule(); }); // a session wrote its cost-state record
  es.onerror = () => {
    setLive(false);
    if (es.readyState === EventSource.CLOSED) setTimeout(connect, 2000); // the browser retries on its own otherwise
  };
}
connect();
</script>
</body>
</html>
